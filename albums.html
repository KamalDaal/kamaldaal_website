<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<title>Albums & Events | KamalDaal</title>
<style>
:root{--bg:#030303;--gold:#d4af37;--gold2:#ffe7a0;--text:#f7f4eb;--muted:#aaa49a;--line:#493a17}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% 0%,#241b07,transparent 40%),var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:24px}
nav{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}
a{color:var(--gold2)}
.hero{padding:55px 0 25px}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:12px}
h1{font-size:clamp(38px,7vw,76px);line-height:1.05;margin:12px 0}
.gold{background:linear-gradient(90deg,#b8860b,#ffe7a0,#d4af37);color:transparent;background-clip:text}
.hero p{max-width:650px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.filters button{border:1px solid var(--line);border-radius:30px;background:#100d06;color:var(--gold2);padding:9px 14px;cursor:pointer}
.filters button.active{background:#332608;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#090909;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 35px #d4af3725}
.cover{width:100%;height:220px;object-fit:cover;background:#111;display:block}
.body{padding:16px}.body h2{font-size:20px;margin:8px 0}
.meta{color:var(--muted);font-size:14px}.pill{display:inline-block;color:var(--gold2);border:1px solid var(--line);border-radius:30px;padding:3px 9px;font-size:12px}
.body p{color:#c5c0b5}.btn{border:1px solid #6a541e;border-radius:9px;padding:8px 12px;background:#171207;color:var(--gold2);cursor:pointer}
.notice{color:var(--muted);padding:24px 0}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:5;overflow:auto;padding:20px}
.modal.open{display:block}.modalbox{max-width:1000px;margin:4vh auto;background:#090909;border:1px solid var(--line);border-radius:18px;padding:20px}
.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:start}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:20px}
.photos img{width:100%;height:230px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.lightbox{display:none;position:fixed;inset:0;background:#000f;z-index:10;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}
footer{margin-top:45px;padding:20px 0;border-top:1px solid var(--line);color:#777}
@media(max-width:600px){.wrap{padding:16px}.hero{padding-top:35px}.cover{height:190px}}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="brand">KAMAL<span>DAAL</span></div>
  <div><a href="./index.html">Home</a>　<a href="./albums.html">Albums</a></div>
</nav>

<section class="hero">
  <div class="eyebrow">EVENTS · MILESTONES · MEMORIES</div>
  <h1>Every chapter.<br><span class="gold">A story worth keeping.</span></h1>
  <p>My journey through pharmaceutical industry, research, competitions, conferences and achievements.</p>
</section>

<div id="filters" class="filters"></div>
<div id="gallery" class="grid"></div>

<footer>© <span id="year"></span> KamalDaal · Research, innovation & pharmacy</footer>
</div>

<div id="modal" class="modal">
 <div class="modalbox">
  <div class="modalhead">
   <div><span id="mCategory" class="pill"></span><h2 id="mTitle"></h2><div id="mMeta" class="meta"></div><p id="mDescription"></p></div>
   <button id="closeModal" class="btn">Close ✕</button>
  </div>
  <div id="mPhotos" class="photos"></div>
 </div>
</div>
<div id="lightbox" class="lightbox"><img id="lightboxImg" alt="Expanded event photo"></div>

<script>
/* Add new events inside the EVENTS array below.
   For each event, use photo paths such as "photos/abbott-1.jpg". */
const EVENTS = [
 {
  title:"Abbott Healthcare — Industrial Internship",
  category:"Internship",
  date:"June – July 2026",
  location:"Baddi, Himachal Pradesh",
  description:"Industrial training with exposure to Production, Quality Assurance, documentation practices and Quality Control.",
  cover:"photos/abbott-1.jpg",
  photos:[
   "photos/abbott-1.jpg",
   "photos/abbott-2.jpg",
   "photos/abbott-3.jpg",
   "photos/abbott-4.jpg",
   "photos/abbott-5.jpg",
   "photos/abbott-6.jpg",
   "photos/abbott-7.jpg"
  ]
 },
 {
  title:"Research Poster Presentation",
  category:"Research",
  date:"2026",
  location:"Academic Conference",
  description:"Research poster presentation and scientific exchange. Add the original poster and event photographs here.",
  cover:"photos/poster-1.jpg",
  photos:["photos/poster-1.jpg"]
 },
 {
  title:"Spandan — Sports & Activities",
  category:"Awards",
  date:"2025–2026",
  location:"Jagannath University",
  description:"A collection of sports, cultural activities and university memories.",
  cover:"photos/spandan-1.jpg",
  photos:["photos/spandan-1.jpg"]
 },
 {
  title:"Awards & Achievements",
  category:"Awards",
  date:"2025–2026",
  location:"University",
  description:"Certificates and milestones from academic and extracurricular activities.",
  cover:"photos/awards-1.jpg",
  photos:["photos/awards-1.jpg"]
 }
];

const $ = id => document.getElementById(id);
$("year").textContent = new Date().getFullYear();
let activeCategory = "All";

function make(tag, cls, text) {
 const node = document.createElement(tag);
 if(cls) node.className = cls;
 if(text !== undefined) node.textContent = text;
 return node;
}

function renderFilters() {
 const categories = ["All", ...new Set(EVENTS.map(e => e.category))];
 const box = $("filters");
 box.replaceChildren();
 categories.forEach(category => {
  const button = make("button", activeCategory === category ? "active" : "", category);
  button.onclick = () => {
   activeCategory = category;
   renderFilters();
   renderCards();
  };
  box.append(button);
 });
}

function openAlbum(event) {
 $("mCategory").textContent = event.category;
 $("mTitle").textContent = event.title;
 $("mMeta").textContent = [event.date, event.location].filter(Boolean).join(" · ");
 $("mDescription").textContent = event.description || "";
 const box = $("mPhotos");
 box.replaceChildren();
 event.photos.forEach(path => {
  const img = make("img");
  img.src = path;
  img.alt = event.title;
  img.loading = "lazy";
  img.onerror = () => { img.style.display = "none"; };
  img.onclick = () => {
   $("lightboxImg").src = path;
   $("lightbox").classList.add("open");
  };
  box.append(img);
 });
 $("modal").classList.add("open");
}

function renderCards() {
 const box = $("gallery");
 box.replaceChildren();
 const visible = EVENTS.filter(e => activeCategory === "All" || e.category === activeCategory);
 visible.forEach(event => {
  const card = make("article", "card");
  const img = make("img", "cover");
  img.src = event.cover;
  img.alt = event.title;
  img.loading = "lazy";
  img.onerror = () => { img.style.visibility = "hidden"; };
  card.append(img);

  const body = make("div", "body");
  body.append(make("span", "pill", event.category));
  body.append(make("h2", "", event.title));
  body.append(make("div", "meta", [event.date, event.location].filter(Boolean).join(" · ")));
  body.append(make("p", "", event.description));
  const btn = make("button", "btn", `Open album · ${event.photos.length} photos`);
  btn.onclick = () => openAlbum(event);
  body.append(btn);
  card.append(body);
  box.append(card);
 });
}
$("closeModal").onclick = () => $("modal").classList.remove("open");
$("modal").onclick = e => { if(e.target === $("modal")) $("modal").classList.remove("open"); };
$("lightbox").onclick = () => $("lightbox").classList.remove("open");
document.onkeydown = e => { if(e.key === "Escape") { $("modal").classList.remove("open"); $("lightbox").classList.remove("open"); } };
renderFilters();
renderCards();
</script>
</body>
</html>
